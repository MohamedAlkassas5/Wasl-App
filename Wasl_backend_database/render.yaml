# Render.com blueprint — free-tier web service + Postgres.
# Deploy: push repo to GitHub → Render → "New Blueprint" → pick this repo.
# Render injects DATABASE_URL automatically from the linked database.
services:
  - type: web
    name: wasl-backend
    runtime: docker
    rootDir: Wasl_backend_database
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: wasl-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PHONE
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false

databases:
  - name: wasl-db
    plan: free

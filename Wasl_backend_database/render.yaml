# Render.com blueprint — free-tier web service + Postgres.
# Deploy: push repo to GitHub → Render → "New Blueprint" → pick this repo.
#
# ⚠️ Which database is production?
#
# DEPLOYMENT.md §1 states production runs on **Neon**, and that is the intent.
# This blueprint also declares a Render Postgres (`wasl-db`) below and wires
# DATABASE_URL to it, which means a blueprint deploy points the app at Render's
# database, not Neon.
#
# That contradiction is deliberate to leave visible rather than silently
# resolve. To deploy against Neon, override DATABASE_URL in the Render dashboard
# with the Neon connection string — a dashboard value wins over the one derived
# here. The `wasl-db` resource is kept because deleting a database resource from
# a live blueprint destroys the data in it.
#
# It matters for backups: Render's free Postgres has **no automatic backups and
# is deleted after 90 days**. See RUNBOOK.md §1.
services:
  - type: web
    name: wasl-backend
    runtime: docker
    rootDir: Wasl_backend_database
    dockerfilePath: ./Dockerfile
    plan: free
    # Real readiness: this queries the database, unlike the previous value ("/"),
    # which pointed at a route that is not even registered — every health check
    # was a 404. See src/health/health.controller.ts.
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: wasl-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # 🔴 Required in production — main.ts refuses to boot without it. It was
      # missing here, so a blueprint deploy crashed on startup. Set to the
      # comma-separated origins allowed to call the API (the admin panel's URL);
      # sync:false keeps the value in the dashboard rather than in the repo.
      - key: CORS_ORIGINS
        sync: false
      # 🛡️ Render terminates TLS at its proxy, so without this every request
      # appears to come from the proxy's IP and the rate limiter treats the
      # entire internet as one client.
      - key: TRUST_PROXY
        value: 'true'
      # 🔭 Error monitoring. Leave unset and Sentry stays completely inert —
      # nothing is initialised and nothing is sent. See src/common/sentry.ts.
      - key: SENTRY_DSN
        sync: false
      # 🗄️ Object storage (CP6-G). Production refuses local disk outright —
      # the container filesystem is wiped on every deploy, which would lose
      # approved drivers' identity documents — so this must be s3.
      - key: STORAGE_DRIVER
        value: s3
      # Cloudflare R2 credentials. sync:false means the values live in the
      # Render dashboard and never in this repository. The endpoint embeds the
      # account id, so it is withheld here too.
      #
      # ⚠️ The bucket must be PRIVATE: no Public Development URL (r2.dev), no
      # custom domain. Every file is served through GET /uploads, which runs
      # the ownership checks in FilesService before sending a byte. A publicly
      # reachable object URL bypasses all of them at once.
      - key: R2_ENDPOINT
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: ADMIN_PHONE
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false

databases:
  - name: wasl-db
    plan: free

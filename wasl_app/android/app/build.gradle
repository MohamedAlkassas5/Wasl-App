plugins {
    id "com.android.application"
    id "kotlin-android"
    id "com.google.gms.google-services" // 🎯 السطر السحري المطلوب لتفعيل قراءة الفايربيز
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0"
}

// ── CP-I: release signing ────────────────────────────────────────────────
// `key.properties` holds the upload keystore's location and passwords. It is
// git-ignored (along with *.jks / *.keystore) and never committed — see
// SECURITY.md. Without it the release build falls back to the debug key and
// says so loudly, so `flutter run --release` still works for a developer while
// a store build can never be signed with the debug key unnoticed.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
def hasReleaseKeystore = keystorePropertiesFile.exists()
if (hasReleaseKeystore) {
    keystorePropertiesFile.withReader("UTF-8") { reader ->
        keystoreProperties.load(reader)
    }
}

// ── CP-I: application id ─────────────────────────────────────────────────
// ⚠️ Q-G1 is unresolved, so this deliberately still defaults to the id the
// app already ships under. It is NOT a placeholder that can simply be edited:
// `android/app/google-services.json` is registered to this exact package, and
// changing one without the other silently breaks push (CP-C).
//
// To change it: register the new package in the Firebase console, download
// the replacement google-services.json, then either edit the default below or
// build with `-PwaslApplicationId=<new id>`.
def waslApplicationId = project.findProperty("waslApplicationId") ?: "com.example.wasl_app"

android {
    namespace = "com.example.wasl_app"
    compileSdk = flutter.compileSdkVersion
    ndkVersion "26.1.10909125"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        // See `waslApplicationId` above — coupled to google-services.json.
        applicationId = waslApplicationId
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.

        // 🎯 تم التحديث إلى 23 لتوافق Firebase Core و Auth بدون أخطاء
        minSdkVersion = flutter.minSdkVersion

        targetSdk = flutter.targetSdkVersion
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
    }

    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                keyAlias = keystoreProperties["keyAlias"]
                keyPassword = keystoreProperties["keyPassword"]
                storeFile = keystoreProperties["storeFile"] ? file(keystoreProperties["storeFile"]) : null
                storePassword = keystoreProperties["storePassword"]
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseKeystore) {
                signingConfig = signingConfigs.release
            } else {
                // A local release build with no keystore is a developer running
                // `flutter run --release`, not a store upload — Play rejects a
                // debug-signed bundle outright, so this cannot ship by accident.
                // It is still worth saying out loud, because a debug-signed
                // release that builds quietly is exactly how one gets uploaded.
                logger.warn("⚠️  key.properties not found — signing this release with the DEBUG key. "
                    + "Do not upload this artifact. See RELEASE.md.")
                signingConfig = signingConfigs.debug
            }
        }
    }
}

flutter {
    source = "../.."
}

org.gradle.jvmargs=-Xmx4G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# Kotlin incremental compilation leaves file handles open on Windows, which
# breaks with "Could not close incremental caches" when Defender/an indexer
# locks build\. A full (non-incremental) compile avoids that cache entirely.
kotlin.incremental=false
